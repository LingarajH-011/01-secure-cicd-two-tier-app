name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy to the test server over SSH?"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements-dev.txt
      - run: pip install -r app/requirements-dev.txt
      - name: Lint
        run: flake8 app --max-line-length=100
      - name: Unit tests
        run: pytest app/tests -q

  build-and-scan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --pull -t two-tier-app:${{ github.sha }} .
      - name: Trivy scan (fail on HIGH/CRITICAL with a fix available)
        # Trivy runs from its official image, pinned to a version, instead of a third-party action.
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            aquasec/trivy:0.58.1 image --scanners vuln \
            --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            two-tier-app:${{ github.sha }}
      - name: Trivy report (always saved)
        if: always()
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v trivy-cache:/root/.cache/ \
            -v "$PWD":/out \
            aquasec/trivy:0.58.1 image --scanners vuln \
            --ignore-unfixed --format json --output /out/trivy-report.json \
            two-tier-app:${{ github.sha }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json

  deploy:
    # Manual only, and only when you tick "deploy". Needs repo secrets:
    # DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_PATH (folder of this repo on the server)
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: build-and-scan
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            git pull
            bash scripts/deploy.sh
